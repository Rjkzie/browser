name: Windows browser
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache-dependency-path: native/awg/go.sum
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: go test -v ./...
        working-directory: native/awg
      - run: npm run bundle:components
      - run: npm run build:native
      - run: npm run smoke
      - run: npm run build
      - name: Checksums
        shell: pwsh
        run: |
          $file = Get-ChildItem release/*.exe | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($file.Name)" | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-browser-windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG --json id *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output 'Release already published. The checked CI build remains available as an Actions artifact.'
          } else {
            gh release create $env:RELEASE_TAG release/*.exe release/SHA256SUMS.txt --title "Quiet Browser $env:RELEASE_TAG" --notes-file docs/RELEASE.md
          }
